name: Deploy

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0

      - name: Restore dependencies
        run: dotnet restore ./backend/source/API

      - name: Build backend
        run: dotnet build --configuration Release ./backend/source/API

  publish-images:
    name: Publish Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-frontend
      - build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: image-names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-frontend:latest
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/source/API
          push: true
          tags: |
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-backend:latest
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-backend:${{ github.sha }}