name: Publish Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Publish Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Read project version
        id: version
        shell: bash
        run: |
          major=$(jq -r '.major' version.json)
          minor=$(jq -r '.minor' version.json)
          patch=$(jq -r '.patch' version.json)
          echo "value=${major}.${minor}.${patch}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: image-names
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-frontend:${{ steps.version.outputs.value }}
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-frontend:latest
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/source/API
          push: true
          tags: |
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-backend:${{ steps.version.outputs.value }}
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-backend:latest
            ghcr.io/${{ steps.image-names.outputs.owner }}/maneko-backend:${{ github.sha }}
