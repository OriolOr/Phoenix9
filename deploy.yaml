version: "3.7"
services:
  mongo:
    container_name: mongo_database
    image: mongo
    ports:
      - "27017:27017"
    networks: 
      - maneko-network 
  
  frontend: 
    # Para desarrollo local con build:
    # build: 
    #   context: ./frontend
    #   dockerfile: Dockerfile
    # Para deployment desde GitHub Container Registry:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    container_name: frontend_maneko
    ports:
      - "8080:8080"
    networks: 
      - maneko-network 

  backend:
    # Para desarrollo local con build:
    # build: 
    #   context: ./backend/source/API
    #   dockerfile: Dockerfile 
    # Para deployment desde GitHub Container Registry:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: backend_maneko
    ports:
      - "5000:5000"
      - "5001:5001"
    networks: 
      - maneko-network 

networks : 
  maneko-network:    


